services:
  cryptojackal:
    build: .
    container_name: cryptojackal
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - PAPER_TRADING_MODE=true
      - INITIAL_BALANCE=10000
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
